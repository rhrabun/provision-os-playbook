# Guard docker-published ports with ufw. Root docker writes host-wide DNAT rules
# that bypass ufw, so a container published with -p is reachable even under
# `ufw default deny incoming`. ufw-docker routes DOCKER-USER traffic back through
# ufw's filter chains. Meaningless for rootless docker, whose userspace proxy is
# already filtered by ufw, so this only runs for docker_root.
- name: Check ufw status
  become: true
  ansible.builtin.command: ufw status
  register: system_ufw_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Configure ufw-docker
  when: "'Status: active' in system_ufw_status.stdout"
  block:
    - name: Install ufw-docker (pacman)
      become: true
      community.general.pacman:
        name: ufw-docker
        state: present
      when: ansible_facts['pkg_mgr'] == 'pacman'

    - name: Install ufw-docker (apt)
      become: true
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/chaifeng/ufw-docker/master/ufw-docker
        dest: /usr/local/bin/ufw-docker
        mode: "0755"
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Check whether ufw-docker rules are already installed
      ansible.builtin.command: grep -q ufw-docker /etc/ufw/after.rules
      register: system_ufw_docker_rules
      changed_when: false
      failed_when: false

    - name: Install ufw-docker rules
      become: true
      ansible.builtin.command: ufw-docker install
      changed_when: true
      when: system_ufw_docker_rules.rc != 0
      notify: Reload ufw
