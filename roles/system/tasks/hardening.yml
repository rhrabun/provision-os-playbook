# Server hardening
- name: Require deploy user and ssh keys
  ansible.builtin.assert:
    that:
      - deploy_user is defined and deploy_user | length > 0
      - deploy_ssh_key is defined and deploy_ssh_key | length > 0
      - root_ssh_key is defined and root_ssh_key | length > 0
    fail_msg: >-
      missing var for {{ inventory_hostname }}. Set deploy_user, deploy_ssh_key and root_ssh_key
      in role vars or inventory, e.g.
      -e deploy_user=roman -e deploy_ssh_key='ssh-ed25519 AAAA...' -e root_ssh_key='ssh-ed25519 AAAA...'

- name: Install root ssh pubkeys
  become: true
  vars:
    root_keys: "{{ root_ssh_key is string | ternary([root_ssh_key], root_ssh_key) }}"
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    state: present
  loop: "{{ root_keys }}"

- name: Create deploy user
  become: true
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    create_home: true

- name: Install deploy user ssh pubkeys
  become: true
  vars:
    deploy_keys: "{{ deploy_ssh_key is string | ternary([deploy_ssh_key], deploy_ssh_key) }}"
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ deploy_keys }}"
  when: not ansible_check_mode

- name: SSH policy drop-in
  become: true
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/hardening.conf
    content: |
      PermitRootLogin yes
      PasswordAuthentication no
      PubkeyAuthentication yes
  notify: restart ssh

- name: Validate sshd configuration
  become: true
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Configure ufw
  block:
    - name: Install ufw
      become: true
      ansible.builtin.package:
        name: ufw
        state: present

    - name: ufw default deny incoming
      become: true
      community.general.ufw:
        default: deny
        direction: incoming
        state: enabled
      when: not ansible_check_mode

    - name: ufw default allow outgoing
      become: true
      community.general.ufw:
        default: allow
        direction: outgoing
        state: enabled
      when: not ansible_check_mode

    - name: ufw allow OpenSSH
      become: true
      community.general.ufw:
        rule: allow
        name: OpenSSH
      when: not ansible_check_mode
    
    - name: Allow tailnet interface
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
      when: not ansible_check_mode

    - name: Enable ufw
      become: true
      community.general.ufw:
        state: enabled
      when: not ansible_check_mode

- name: Configure automatic security upgrades
  when: ansible_facts['pkg_mgr'] == 'apt'
  block:
    - name: Install unattended-upgrades
      become: true
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true

    - name: Enable automatic security upgrades
      become: true
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
