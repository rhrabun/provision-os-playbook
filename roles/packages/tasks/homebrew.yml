- name: Update Brew and packages
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true

- name: Add Homebrew taps
  community.general.homebrew_tap:
    name: "{{ homebrew_taps }}"
    state: present

- name: Install CLI utilities
  community.general.homebrew:
    name: "{{ homebrew_cli_utils }}"
    state: present

- name: Install GUI applications (Casks)
  community.general.homebrew_cask:
    name: "{{ homebrew_casks }}"
    state: present

- name: Install Mac App Store applications
  community.general.mas:
    id: "{{ item.id }}"
    state: present
  loop: "{{ homebrew_mas_apps }}"
