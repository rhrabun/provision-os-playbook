---
- name: Read the personal user
  ansible.builtin.getent:
    database: passwd
    key: "{{ rex_personal_user }}"

- name: Remember the personal user's ID and home
  ansible.builtin.set_fact:
    rex_user_uid: "{{ ansible_facts['getent_passwd'][rex_personal_user][1] }}"
    rex_user_home: "{{ ansible_facts['getent_passwd'][rex_personal_user][4] }}"

- name: Read the Rex CLI commands
  ansible.builtin.command:
    cmd: /usr/bin/rex server --help
  register: rex_server_help
  changed_when: false
  check_mode: false

- name: Require a Rex CLI with server install
  ansible.builtin.assert:
    that:
      - "'install' in rex_server_help.stdout"
    fail_msg: >-
      rex server install is missing; upgrade rex to
      0.1.0-preview.14 or newer.

- name: Stop the system-wide Rex units
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - rex.service
    - rex.socket
    - rex-login-server.service
    - rex-login-server.socket

- name: Look for the previous personal service
  ansible.builtin.stat:
    path: "{{ rex_user_home }}/.config/systemd/user/default.target.wants/rex.service"
  register: rex_personal_service

- name: Stop the previous personal service
  when: rex_personal_service.stat.exists
  become: true
  become_user: "{{ rex_personal_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ rex_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ rex_user_uid }}/bus"
  ansible.builtin.systemd_service:
    name: rex.service
    scope: user
    enabled: false
    state: stopped

- name: Remove the old hand-written unit
  ansible.builtin.file:
    path: "{{ rex_user_home }}/.config/systemd/user/rex.service"
    state: absent

- name: Create the user drop-in directory
  ansible.builtin.file:
    path: "{{ rex_user_home }}/.config/systemd/user/rex.service.d"
    state: directory
    owner: "{{ rex_personal_user }}"
    group: "{{ rex_personal_user }}"
    mode: "0755"

- name: Install the personal server drop-in
  ansible.builtin.template:
    src: rex.user.service.override.conf.j2
    dest: "{{ rex_user_home }}/.config/systemd/user/rex.service.d/override.conf"
    owner: "{{ rex_personal_user }}"
    group: "{{ rex_personal_user }}"
    mode: "0644"
  notify:
    - Stop the personal server
    - Restart rex user

- name: Start the personal server at boot
  when: not ansible_check_mode
  become: true
  become_user: "{{ rex_personal_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ rex_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ rex_user_uid }}/bus"
  ansible.builtin.command:
    cmd: /usr/bin/rex server install
  changed_when: false
