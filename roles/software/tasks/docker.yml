- name: Install OrbStack
  community.general.homebrew_cask:
    name: orbstack
    state: present
  when: ansible_facts['pkg_mgr'] == 'homebrew'

- name: Install docker
  when: ansible_facts['pkg_mgr'] == 'apt'
  block:
    - name: Install docker dependencies
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-debian
        state: present

    - name: Add docker gpg key
      become: true
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add docker apt repo
      become: true
      ansible.builtin.deb822_repository:
        name: docker-ce
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
      when: not ansible_check_mode

    - name: Install docker-ce + compose plugin
      become: true
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true
      when: not ansible_check_mode

    - name: Capture /etc/docker dir state
      become: true
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Docker log rotation daemon.json
      become: true
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }
      notify: restart docker

    - name: Add deploy user to docker group
      become: true
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true
      when: not ansible_check_mode

    - name: Start docker service
      become: true
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
      when: not ansible_check_mode