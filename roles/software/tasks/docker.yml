- name: Install OrbStack
  community.general.homebrew_cask:
    name: orbstack
    state: present
  when: ansible_facts['pkg_mgr'] == 'homebrew'

- name: Install docker (apt)
  when: ansible_facts['pkg_mgr'] == 'apt'
  block:
    - name: Install docker dependencies
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-debian
        state: present

    - name: Add docker gpg key
      become: true
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add docker apt repo
      become: true
      ansible.builtin.deb822_repository:
        name: docker-ce
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
      when: not ansible_check_mode

    - name: Install docker-ce + compose plugin
      become: true
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true
      when: not ansible_check_mode

- name: Install docker (pacman)
  when: ansible_facts['pkg_mgr'] == 'pacman'
  block:
    - name: Install docker packages
      become: true
      community.general.pacman:
        name:
          - docker
          - docker-buildx
          - docker-compose
        state: present

- name: Capture /etc/docker dir state
  become: true
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"
  when: ansible_facts['pkg_mgr'] in ['apt', 'pacman']

- name: Docker log rotation daemon.json
  become: true
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }
    mode: "0644"
  notify: Restart docker
  when: ansible_facts['pkg_mgr'] in ['apt', 'pacman']

- name: Add deploy user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
  when:
    - docker_root
    - ansible_facts['pkg_mgr'] in ['apt', 'pacman']
    - not ansible_check_mode

- name: Start docker service
  become: true
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  when:
    - docker_root
    - ansible_facts['pkg_mgr'] in ['apt', 'pacman']
    - not ansible_check_mode

- name: Set up rootless docker
  when:
    - not docker_root
    - ansible_facts['pkg_mgr'] in ['apt', 'pacman']
  block:
    - name: Assert rootless docker is available on this platform
      ansible.builtin.assert:
        that: ansible_facts['pkg_mgr'] == 'apt'
        fail_msg: >-
          Rootless docker (docker_root=false) is only supported on apt hosts: the
          Arch docker package does not ship dockerd-rootless-setuptool.sh.

    - name: Create deploy user
      become: true
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true
      when: not ansible_check_mode

    - name: Install rootless docker packages
      become: true
      ansible.builtin.apt:
        name:
          - docker-ce-rootless-extras
          - dbus-user-session
          - uidmap
          - slirp4netns
          - fuse-overlayfs
        state: present
        update_cache: true
      when: not ansible_check_mode

    - name: Read deploy user passwd entry
      ansible.builtin.getent:
        database: passwd
        key: "{{ deploy_user }}"

    - name: Enable systemd lingering for deploy user
      become: true
      ansible.builtin.command:
        cmd: "loginctl enable-linger {{ deploy_user }}"
        creates: "/var/lib/systemd/linger/{{ deploy_user }}"
      when: not ansible_check_mode

    - name: Set up rootless docker for deploy user
      become: true
      become_user: "{{ deploy_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[deploy_user][1] }}"
      ansible.builtin.command:
        cmd: dockerd-rootless-setuptool.sh install
        creates: "/home/{{ deploy_user }}/.config/systemd/user/docker.service"
      when: not ansible_check_mode
