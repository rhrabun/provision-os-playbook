- name: Update package database
  become: true
  community.general.pacman:
    update_cache: true

- name: Install CLI packages
  become: true
  community.general.pacman:
    name: "{{ base_packages }}"
    state: present

- name: Install extra packages
  become: true
  community.general.pacman:
    name: "{{ dev_packages_pacman }}"
    state: present

- name: Install GUI packages
  become: true
  community.general.pacman:
    name: "{{ dev_gui_packages + dev_gui_packages_pacman }}"
    state: present

- name: Remove unneeded dependencies
  become: true
  community.general.pacman:
    autoremove: true
