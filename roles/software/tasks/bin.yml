# Install tools shipped as prebuilt static binaries (not in distro repos)
- name: Install chezmoi
  become: true
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://get.chezmoi.io | sh -s -- -b /usr/local/bin
    executable: /bin/bash
  args:
    creates: /usr/local/bin/chezmoi

- name: Update chezmoi
  become: true
  ansible.builtin.command:
    cmd: /usr/local/bin/chezmoi upgrade
  register: chezmoi_upgrade
  changed_when: "'already at the latest version' not in chezmoi_upgrade.stdout"

- name: Install mise
  become: true
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://mise.run | MISE_INSTALL_PATH=/usr/local/bin/mise sh
    executable: /bin/bash
  args:
    creates: /usr/local/bin/mise

- name: Update mise
  become: true
  ansible.builtin.command:
    cmd: /usr/local/bin/mise self-update --yes --no-plugins
  register: mise_update
  changed_when: "'already up to date' not in mise_update.stdout"
