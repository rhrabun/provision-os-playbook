all:
  children:
    local:
      vars:
        software_update_all: true
      hosts:
        current:
          ansible_host: localhost
          ansible_user: <username>
          ansible_connection: local
          ansible_host_key_checking: false
          profile: personal # personal or dev
    servers:
      vars:
        profile: server
        software_update_all: false
        # rex_mode: personal # personal, shared, login, or none
        # rex_login_principals: # login mode only; keep real identities in inventory.yml
        #   - "tailscale:alice@example.com"
      hosts:
        first-server:
          ansible_host: <ip>
          ansible_user: <user>
          deploy_user: <deploy-username>
          root_ssh_key:
            - "<ssh-ed25519 pubkey>"
            - "<ssh-ed25519 pubkey mobile>"
          deploy_ssh_key:
            - "<ssh-ed25519 pubkey>"
            - "<ssh-ed25519 pubkey mobile>"
        second-server:
          ansible_host: <ip>
          ansible_user: <user>
          deploy_user: <deploy-username>
          root_ssh_key:
            - "<ssh-ed25519 pubkey>"
            - "<ssh-ed25519 pubkey mobile>"
          deploy_ssh_key:
            - "<ssh-ed25519 pubkey>"
            - "<ssh-ed25519 pubkey mobile>"
