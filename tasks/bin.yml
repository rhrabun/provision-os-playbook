# Install tools shipped as prebuilt static binaries (not in distro repos)
- name: Create zellij install dir
  become: true
  ansible.builtin.file:
    path: /usr/local/lib/zellij
    state: directory

- name: Download zellij
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/zellij-org/zellij/releases/download/{{ zellij_release }}/zellij-{{ zellij_arch }}-unknown-linux-musl.tar.gz"
    dest: /usr/local/lib/zellij/zellij.tar.gz
    checksum: "sha256:{{ zellij_checksum[zellij_arch] }}"

- name: Extract zellij
  become: true
  ansible.builtin.unarchive:
    src: /usr/local/lib/zellij/zellij.tar.gz
    dest: /usr/local/lib/zellij
    remote_src: true
    creates: /usr/local/bin/zellij
  when: not ansible_check_mode

- name: Link zellij into PATH
  become: true
  ansible.builtin.file:
    src: /usr/local/lib/zellij/zellij
    dest: /usr/local/bin/zellij
    state: link
  when: not ansible_check_mode