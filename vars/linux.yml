---

# Base CLI toolset — every Linux host, apt + pacman
pkgs_cli:
  - gh
  - zsh
  - fzf
  - bat
  - git
  - vim
  - btop
  - make
  - zoxide
  - restic
  - ripgrep
  - uv
  - httpie
  - tealdeer
  - pre-commit

pkgs_extra_apt:
  personal:
    - fd-find
    - mise
    - lazygit
    - lazydocker
pkgs_extra_pacman:
  personal:
    - fd
    - mise
    - lazygit
    - lazydocker

# GUI apps — personal desktop only. Mirrors the macOS casks where the platform
# allows it; macOS-only apps (lulu, aldente, bettermouse, ...) have no equivalent
# and are left to the desktop environment (omarchy/Hyprland/fcitx5).
pkgs_gui_apt:
  personal:
    - vlc
    - telegram-desktop
    # bitwarden, proton-vpn-gtk-app and zen-browser have no apt package; add via
    # Flatpak if needed on an apt desktop.
pkgs_gui_pacman:
  personal:
    - vlc
    - telegram-desktop
    - bitwarden
    - proton-vpn-gtk-app
    - zen-browser-bin

# Fonts — personal desktop only, mirrors the macOS font casks
pkgs_fonts_apt:
  personal:
    - fonts-inter
    - fonts-firacode
pkgs_fonts_pacman:
  personal:
    - inter-font
    - ttf-firacode-nerd

# Guard docker-published ports with ufw (root docker only)
docker_ufw: true

# zellij
zellij_release: v0.45.1
zellij_checksum:
  x86_64: 40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc
  aarch64: 05f0802afadd53f8db9514e7cae53c9ae8432fed1b35b8294aa816ee3044a16b
# binary asset naming: amd64 -> x86_64, arm64 -> aarch64
linux_arch: "{{ 'aarch64' if ansible_facts['architecture'] == 'arm64' else (ansible_facts['architecture'] | replace('amd64', 'x86_64')) }}"

# herdr
herdr_release: v0.9.3
herdr_checksum:
