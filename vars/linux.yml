  aarch64: 4de7aa3e25678812e92960de64f7c2aaa1bca1f0f80a3c5e559837e231e1f5c0

# chezmoi
chezmoi_release: v2.72.1
chezmoi_checksum:
  amd64: 9f97d32caca166e5c92160ec3a9325519809c38963121cef38173142065c981f
  arm64: 75508ef41216b6d64f3145986b751729d7f92d09c6bad77d51cf2895ab35a508
chezmoi_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'arm64' else 'amd64' }}"
