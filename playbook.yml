- name: Configure OS
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Print available facts
      ansible.builtin.debug:
        var: ansible_facts
      tags: [never, facts]

    # Ansible evaluates vars_files at playbook parse time (before facts are gathered),
    # so loading of OS-specific variables must be done when facts are available
    - name: Include Darwin-specific vars
      when: ansible_facts['os_family'] == 'Darwin'
      ansible.builtin.include_vars:
        file: "vars/macos.yml"
      tags: always

    - name: Include Linux-specific vars
      when: ansible_facts['os_family'] != 'Darwin'
      ansible.builtin.include_vars:
        file: "vars/linux.yml"
      tags: always

    - name: Validate profile
      ansible.builtin.assert:
        that:
          - profile is defined
          - profile in ['personal', 'dev', 'server']
        fail_msg: "profile must be one of: personal, dev, server (got '{{ profile | default('<undefined>') }}')"
      tags: always

    - name: Personal hosts must run macOS
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Darwin'
        fail_msg: "profile 'personal' is macOS-only; {{ inventory_hostname }} is {{ ansible_facts['os_family'] }}"
      when: profile == 'personal'
      tags: always

    - name: Servers must run Linux with apt
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] != 'Darwin'
          - ansible_facts['pkg_mgr'] == 'apt'
        fail_msg: "profile 'server' is Linux/apt-only; {{ inventory_hostname }} is {{ ansible_facts['os_family'] }}/{{ ansible_facts['pkg_mgr'] }}"
      when: profile == 'server'
      tags: always

    - name: Resolve deploy user home directory
      ansible.builtin.set_fact:
        user_home: "{{ ansible_facts['env']['HOME'] if ansible_facts['os_family'] == 'Darwin' else '/home/' + (deploy_user | default(ansible_user)) }}"
      tags: always

    - name: Verify become access
      tags: always
      block:
        - name: Test sudo with become password
          become: true
          ansible.builtin.command: whoami
          changed_when: false
      rescue:
        - name: Report become failure
          ansible.builtin.fail:
            msg: "Become failed: sudo password incorrect or unavailable. Re-run with a valid password."

  roles:
    - role: software
      tags: software

    - role: system
      tags: system

    - role: hardening
      when: profile == 'server'
      tags: hardening

    - role: shell
      tags: shell

  tasks:
    - name: Create code directory
      ansible.builtin.file:
        path: "{{ user_home }}/code"
        state: directory
        owner: "{{ deploy_user | default(ansible_user) }}"
        mode: "0755"
